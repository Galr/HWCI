# Executable requirements for an EO gimbal (illustrative numbers, not a real spec)
#
# Each computable requirement says:
#   model     -> which virtual-environment run produces the signals
#   formula   -> STL property evaluated on those signals (time 0 = event start)
#   threshold -> used to express margins as a fraction of the limit
#   envelope  -> the scenario space the requirement must hold over (search bounds)
#   nominal   -> the single "design point" a traditional review would check
#   fidelity  -> screen at low fidelity, escalate to high below this normalized margin

system: EO_gimbal_demo

requirements:

  - id: R2_shock_recovery
    title: Line of sight recovers after functional shock
    source: MIL-STD-810H Method 516 (illustrative profile)
    owner: controls lead
    model: shock_response
    formula: "eventually[0, 0.4] ( always[0, 5] los_error_urad < 50 )"
    threshold: 50
    nominal:  {shock_g: 20, shock_ms: 11, axis_deg: 90, temp_c: 20, battery: 1.0}
    envelope:
      shock_g:  [18, 22]
      shock_ms: [10, 12]
      axis_deg: [0, 90]
      temp_c:   [-40, 71]
      battery:  [0.8, 1.0]
    fidelity: {escalate_below: 0.5}

  - id: R3_cold_start
    title: Motor breaks the seals free after cold soak
    source: MIL-STD-810H Method 502 + customer SOW (illustrative)
    owner: mechanical lead
    model: cold_start
    formula: "always[0, 30] torque_ratio > 1.3"
    threshold: 1.3
    nominal:  {temp_c: -32, battery: 1.0}
    envelope:
      temp_c:  [-40, -20]
      battery: [0.8, 1.0]
    fidelity: {escalate_below: 0.0}   # analytic model, single fidelity

  - id: R5_degraded_mode
    title: Pointing jitter stays bounded on the backup encoder
    source: FMEA item 14 - loss of encoder A (illustrative)
    owner: systems lead
    model: shock_response
    formula: "always[0.2, 5] los_error_urad < 200"
    threshold: 200
    fixed:    {shock_g: 0, encoder_a_failed: true}
    nominal:  {base_vib_grms: 1.0, temp_c: 20, seed: 0}
    envelope:
      base_vib_grms: [0.5, 1.5]
      temp_c:        [-40, 71]
      seed:          [0, 1000]
    fidelity: {escalate_below: 0.5}

  - id: R4_field_maintenance
    title: Technician (5th-95th percentile, arctic gloves) swaps the camera module in < 10 min
    source: MIL-STD-1472 + customer SOW (illustrative)
    owner: human factors lead
    kind: human_review
    reason: Reach envelope and tool access need a digital-human study and a VR walkthrough; not computable in this prototype.
